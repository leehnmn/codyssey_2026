# ==============================================================================
# AWS Cloud Web Service - Nginx Server Block Configuration
# Path on Ubuntu: /etc/nginx/sites-available/default (or /etc/nginx/conf.d/default.conf)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html;
    index index.html index.htm;

    # Custom Log format with client IP, status, and latency
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # 1. Root Endpoint (/)
    # Serves the main web dashboard page
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # --------------------------------------------------------------------------
    # 2. Health Check Endpoint (/health) - [Deliverable 2 / Requirement 4]
    # Returns HTTP 200 with structured JSON response without touching backend
    # --------------------------------------------------------------------------
    location = /health {
        access_log off; # Health checks are frequent; avoid log bloat
        default_type application/json;
        return 200 '{"status":"UP","statusCode":200,"service":"nginx-cloud-web","message":"Healthy"}\n';
    }

    # --------------------------------------------------------------------------
    # 3. Security Hardening
    # Hide Nginx version from response headers
    # --------------------------------------------------------------------------
    server_tokens off;

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
