<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF9900" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0972D3" />
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#232F3E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1300" height="820" fill="#F8FAFC"/>

  <!-- Top Banner / Header -->
  <rect width="1300" height="70" fill="url(#headerGrad)"/>
  <text x="30" y="44" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="0.5">AWS Cloud Architecture: Isolated VPC &amp; Minimal Web Infrastructure</text>
  <rect x="1050" y="22" width="220" height="28" rx="14" fill="#FF9900"/>
  <text x="1160" y="41" fill="#232F3E" font-size="12" font-weight="700" text-anchor="middle">Region: ap-northeast-2 (Seoul)</text>

  <!-- Internet & External Users Zone -->
  <rect x="40" y="100" width="240" height="680" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="100" width="240" height="40" rx="12" fill="#F1F5F9"/>
  <text x="160" y="126" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">🌐 External Network (Internet)</text>

  <!-- External User Client Box -->
  <rect x="60" y="170" width="200" height="150" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="160" cy="215" r="22" fill="#E2E8F0"/>
  <text x="160" y="223" font-size="24" text-anchor="middle">💻</text>
  <text x="160" y="255" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">Public Client / User</text>
  <rect x="80" y="270" width="160" height="24" rx="4" fill="#EFF6FF"/>
  <text x="160" y="286" fill="#1D4ED8" font-size="11" font-weight="600" text-anchor="middle">HTTP: Any (0.0.0.0/0)</text>
  <text x="160" y="306" fill="#64748B" font-size="10" text-anchor="middle">Port: 80 (TCP)</text>

  <!-- Admin User Box -->
  <rect x="60" y="360" width="200" height="160" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="160" cy="405" r="22" fill="#FEF3C7"/>
  <text x="160" y="413" font-size="24" text-anchor="middle">👨‍💻</text>
  <text x="160" y="445" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">Administrator (DevOps)</text>
  <rect x="80" y="460" width="160" height="24" rx="4" fill="#FEF2F2"/>
  <text x="160" y="476" fill="#DC2626" font-size="11" font-weight="700" text-anchor="middle">SSH: My IP Only (/32)</text>
  <text x="160" y="496" fill="#64748B" font-size="10" text-anchor="middle">Port: 22 (TCP) Key Pair Auth</text>

  <!-- Traffic Legend Box -->
  <rect x="60" y="555" width="200" height="195" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="75" y="580" fill="#334155" font-size="13" font-weight="700">📌 Traffic Flow Legend</text>
  <line x1="75" y1="605" x2="115" y2="605" stroke="#FF9900" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="125" y="609" fill="#1E293B" font-size="12">HTTP (Port 80) Flow</text>
  <line x1="75" y1="635" x2="115" y2="635" stroke="#0972D3" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="125" y="639" fill="#1E293B" font-size="12">SSH (Port 22) Flow</text>
  <circle cx="85" cy="670" r="10" fill="#FF9900"/>
  <text x="85" y="674" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="105" y="674" fill="#475569" font-size="11">Sequence Step ID</text>
  <text x="75" y="705" fill="#64748B" font-size="11" font-weight="600">VPC: 10.0.0.0/16</text>
  <text x="75" y="725" fill="#64748B" font-size="11" font-weight="600">Public Subnet: 10.0.1.0/24</text>

  <!-- AWS Boundary Box -->
  <rect x="310" y="100" width="960" height="680" rx="12" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" stroke-dasharray="8,4" filter="url(#shadow)"/>
  <rect x="310" y="100" width="250" height="34" rx="8" fill="#FF9900"/>
  <text x="435" y="122" fill="#232F3E" font-size="13" font-weight="700" text-anchor="middle">☁️ AWS Cloud (ap-northeast-2)</text>

  <!-- Internet Gateway Box -->
  <g transform="translate(340, 310)">
    <rect width="130" height="150" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="65" cy="45" r="24" fill="#FFEDD5"/>
    <text x="65" y="55" font-size="24" text-anchor="middle">🚪</text>
    <text x="65" y="88" fill="#9A3412" font-size="13" font-weight="700" text-anchor="middle">Internet Gateway</text>
    <text x="65" y="106" fill="#C2410C" font-size="10" font-weight="600" text-anchor="middle">(IGW)</text>
    <rect x="15" y="118" width="100" height="18" rx="4" fill="#EA580C"/>
    <text x="65" y="131" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">igw-web-service</text>
  </g>

  <!-- Custom VPC Outer Box -->
  <rect x="500" y="150" width="750" height="610" rx="12" fill="#F8FAFC" stroke="#8C4FFF" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="500" y="150" width="280" height="32" rx="8" fill="#8C4FFF"/>
  <text x="640" y="172" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">🏢 VPC: custom-web-vpc (10.0.0.0/16)</text>

  <!-- Route Table Box -->
  <g transform="translate(530, 205)">
    <rect width="700" height="100" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="700" height="28" rx="8" fill="#F1F5F9"/>
    <text x="20" y="19" fill="#1E293B" font-size="12" font-weight="700">🧭 Public Route Table (rtb-web-public) - Subnet Association</text>
    <!-- Table Header -->
    <text x="40" y="48" fill="#64748B" font-size="11" font-weight="700">Destination CIDR</text>
    <text x="240" y="48" fill="#64748B" font-size="11" font-weight="700">Target Next Hop</text>
    <text x="440" y="48" fill="#64748B" font-size="11" font-weight="700">Status</text>
    <text x="560" y="48" fill="#64748B" font-size="11" font-weight="700">Description</text>
    <!-- Row 1 -->
    <text x="40" y="70" fill="#0F172A" font-size="12" font-family="monospace">10.0.0.0/16</text>
    <text x="240" y="70" fill="#0972D3" font-size="12" font-weight="600">local</text>
    <text x="440" y="70" fill="#16A34A" font-size="12" font-weight="600">Active</text>
    <text x="560" y="70" fill="#475569" font-size="11">VPC Internal Communication</text>
    <!-- Row 2 -->
    <text x="40" y="90" fill="#EA580C" font-size="12" font-weight="700" font-family="monospace">0.0.0.0/0</text>
    <text x="240" y="90" fill="#EA580C" font-size="12" font-weight="700">igw-web-service</text>
    <text x="440" y="90" fill="#16A34A" font-size="12" font-weight="600">Active</text>
    <text x="560" y="90" fill="#0369A1" font-size="11" font-weight="600">Default Internet Route (Makes Subnet Public)</text>
  </g>

  <!-- Public Subnet Box -->
  <rect x="530" y="325" width="700" height="415" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <rect x="530" y="325" width="310" height="28" rx="8" fill="#0D9488"/>
  <text x="685" y="344" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">🌐 Public Subnet: subnet-web-public (10.0.1.0/24)</text>

  <!-- Security Group Container -->
  <rect x="555" y="370" width="650" height="350" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <rect x="555" y="370" width="280" height="26" rx="6" fill="#DC2626"/>
  <text x="695" y="388" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">🛡️ Security Group: sg-web-access (Stateful)</text>

  <!-- Security Group Rules Table -->
  <g transform="translate(570, 405)">
    <rect width="620" height="65" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="15" y="20" fill="#991B1B" font-size="11" font-weight="700">Inbound Rules (Only Allowed Traffic Enters):</text>
    <text x="25" y="38" fill="#1F2937" font-size="11">✓ <tspan font-weight="700">HTTP (80)</tspan> Source: <tspan fill="#2563EB" font-family="monospace">0.0.0.0/0</tspan> (Public Web Access)</text>
    <text x="320" y="38" fill="#1F2937" font-size="11">✓ <tspan font-weight="700">SSH (22)</tspan> Source: <tspan fill="#DC2626" font-family="monospace">&lt;Admin-IP&gt;/32</tspan> (Strictly Restricted)</text>
    <text x="15" y="55" fill="#991B1B" font-size="11" font-weight="700">Outbound Rules:</text>
    <text x="120" y="55" fill="#1F2937" font-size="11">✓ <tspan font-weight="700">All Traffic</tspan> Destination: <tspan font-family="monospace">0.0.0.0/0</tspan> (Allows OS updates &amp; package downloads)</text>
  </g>

  <!-- EC2 Instance Box -->
  <g transform="translate(585, 485)">
    <rect width="590" height="215" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="590" height="28" rx="8" fill="#F59E0B"/>
    <text x="20" y="19" fill="#78350F" font-size="13" font-weight="700">💻 Amazon EC2 Instance: web-server-prod (t2.micro / t3.micro)</text>

    <!-- Sub-components inside EC2 -->
    <!-- Specs & Network -->
    <rect x="15" y="38" width="270" height="85" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="25" y="56" fill="#1E293B" font-size="11" font-weight="700">Network &amp; OS Configuration:</text>
    <text x="25" y="74" fill="#475569" font-size="11">OS: <tspan font-weight="600" fill="#0F172A">Ubuntu 22.04 LTS</tspan> (or AL2023)</text>
    <text x="25" y="92" fill="#475569" font-size="11">Public IPv4: <tspan font-family="monospace" font-weight="700" fill="#2563EB">13.125.45.89</tspan></text>
    <text x="25" y="110" fill="#475569" font-size="11">Private IPv4: <tspan font-family="monospace" font-weight="600" fill="#16A34A">10.0.1.50</tspan></text>

    <!-- Web Server & Endpoints -->
    <rect x="300" y="38" width="275" height="85" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="310" y="56" fill="#1E293B" font-size="11" font-weight="700">Web Application (Nginx / Docker):</text>
    <text x="310" y="74" fill="#475569" font-size="11">Web Server: <tspan font-weight="700" fill="#0D9488">Nginx 1.18+ (Port 80)</tspan></text>
    <text x="310" y="92" fill="#475569" font-size="11">Endpoints: <tspan font-family="monospace" font-weight="600">GET /</tspan> &amp; <tspan font-family="monospace" font-weight="600">GET /health</tspan></text>
    <text x="310" y="110" fill="#475569" font-size="11">Status: <tspan fill="#16A34A" font-weight="700">● Active (Running)</tspan></text>

    <!-- EBS Storage & IAM Role -->
    <rect x="15" y="133" width="270" height="70" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="25" y="153" fill="#1E293B" font-size="11" font-weight="700">💾 Storage (EBS Volume):</text>
    <text x="25" y="171" fill="#475569" font-size="11">Root Volume: <tspan font-weight="600">8 GiB (gp3 / gp2)</tspan></text>
    <text x="25" y="189" fill="#64748B" font-size="10">DeleteOnTermination: Enabled (과금 방지)</text>

    <rect x="300" y="133" width="275" height="70" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="310" y="153" fill="#1E293B" font-size="11" font-weight="700">🔑 IAM Least Privilege:</text>
    <text x="310" y="171" fill="#475569" font-size="11">Role: <tspan font-weight="600" fill="#6366F1">Minimal-Infra-Deployer</tspan></text>
    <text x="310" y="189" fill="#16A34A" font-size="10" font-weight="600">✓ No AdminAccess (EC2/VPC scoped only)</text>
  </g>

  <!-- Directional Arrows & Traffic Flow Numbers -->
  <!-- 1: User to IGW -->
  <path d="M 260 235 L 340 350" fill="none" stroke="#FF9900" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <circle cx="295" cy="275" r="13" fill="#FF9900"/>
  <text x="295" y="280" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">1</text>

  <!-- 1-SSH: Admin to IGW -->
  <path d="M 260 440 L 340 400" fill="none" stroke="#0972D3" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <circle cx="295" cy="430" r="13" fill="#0972D3"/>
  <text x="295" y="435" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">1b</text>

  <!-- 2: IGW to Route Table -->
  <path d="M 470 380 L 530 255" fill="none" stroke="#EA580C" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <circle cx="495" cy="305" r="13" fill="#EA580C"/>
  <text x="495" y="310" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">2</text>

  <!-- 3: Route Table to Subnet / SG -->
  <path d="M 680 305 L 680 370" fill="none" stroke="#0D9488" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <circle cx="680" cy="335" r="13" fill="#0D9488"/>
  <text x="680" y="340" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">3</text>

  <!-- 4: SG to EC2 Nginx -->
  <path d="M 880 470 L 880 485" fill="none" stroke="#FF9900" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <circle cx="880" cy="460" r="13" fill="#FF9900"/>
  <text x="880" y="465" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">4</text>

</svg>
