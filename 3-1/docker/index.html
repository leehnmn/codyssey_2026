<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Cloud Docker Web Service</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 600px; text-align: center; }
        h1 { color: #38bdf8; font-size: 28px; margin-bottom: 12px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
        .badge { background: #065f46; color: #34d399; padding: 6px 16px; border-radius: 9999px; font-weight: 700; font-size: 13px; display: inline-block; margin-bottom: 20px; }
        .code { background: #0f172a; padding: 12px; border-radius: 8px; font-family: monospace; color: #facc15; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">🐳 Docker Container Active (200 OK)</span>
        <h1>AWS Cloud Docker Web Service</h1>
        <p>EC2 인스턴스 내부 컨테이너 환경에서 실행 중인 웹 서버입니다.<br>포트 바인딩: <code>0.0.0.0:80 -> container:80</code></p>
        <div class="code">GET /health &rarr; {"status": "UP", "container": "docker"}</div>
        <p style="font-size: 13px; color: #64748b;">Bonus Task 2 Verified &bull; Nginx Alpine Container</p>
    </div>
</body>
</html>
